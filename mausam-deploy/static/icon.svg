<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72"/>
      <stop offset="50%" stop-color="#2a5298"/>
      <stop offset="100%" stop-color="#3b7fe0"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d0e1f9"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff566"/>
      <stop offset="100%" stop-color="#ffab00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded App Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Radar Wave Ring -->
  <circle cx="256" cy="230" r="160" stroke="rgba(255,255,255,0.15)" stroke-width="6" fill="none" stroke-dasharray="8 8"/>
  <circle cx="256" cy="230" r="110" stroke="rgba(255,255,255,0.2)" stroke-width="4" fill="none"/>
  
  <!-- Stylized Cloud -->
  <g filter="url(#glow)">
    <path d="M190 320 L350 320 A 45 45 0 0 0 375 235 A 65 65 0 0 0 260 170 A 55 55 0 0 0 170 230 A 45 45 0 0 0 190 320 Z" fill="url(#cloudGrad)"/>
  </g>
  
  <!-- Dynamic Lightning Bolt -->
  <polygon points="275,250 225,345 260,345 235,420 315,315 270,315" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
